<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Clicker Game - Musical Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="playground">
    <div class="canvas-area">
      <svg id="canvas" viewBox="0 0 800 600">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g id="visualizer"></g>
        <g id="dynamic-content"></g>
      </svg>
    </div>
    
    <div class="info-panel">
      <div id="status">Click shapes to score points!</div>
      <div class="score">Score: 0</div>
      <div class="combo"></div>
      <div class="power-meter">
        <div class="power-fill"></div>
      </div>
      <div class="controls">
        <button class="btn" onclick="window.playgroundState.gameActive = !window.playgroundState.gameActive">
          Pause/Resume
        </button>
        <button class="btn" onclick="window.playgroundState.init()">
          Restart Game
        </button>
        <div class="volume-control">
          <label for="volume">Music Volume</label>
          <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>

</body>
</html>
